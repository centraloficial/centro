<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12263a"><title>Plan de ataque USFX</title>
<link rel="preconnect" href="https://www.gstatic.com">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef2f5;color:#16222e;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input{font:inherit}button{border:0;background:#e1e8ee;color:#16222e;border-radius:10px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer}
button.p{background:#1f5eff;color:#fff}button.g{background:#dff3ea;color:#0d5c40}button.x{background:#fde4e4;color:#a11}
input{width:100%;min-height:44px;border:1px solid #c9d4de;border-radius:10px;padding:0 12px;background:#fff}
header{position:sticky;top:0;z-index:20;background:#12263a;color:#fff;padding:env(safe-area-inset-top) 10px 8px}
.r{display:flex;align-items:center;gap:8px;height:48px}.r b{flex:1;font-size:17px}header button{min-height:36px;background:#244560;color:#fff;font-size:13px}
#st{font-size:12px;color:#9fc0da}#st:before{content:"";display:inline-block;width:8px;height:8px;border-radius:9px;background:#2fbf8a;margin-right:5px}#st.w:before{background:#f0a020}
#dias{display:none;gap:6px;overflow-x:auto}#dias.on{display:flex}#dias button{flex:1;min-width:48px;background:#244560;position:relative}#dias .on{background:#fff;color:#12263a}
#dias u{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:6px;background:#1f5eff}
main{padding:10px;max-width:760px;margin:auto}section{display:none}section.on{display:block}
.seg{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.seg button{flex:1;white-space:nowrap;background:#fff;border:1px solid #c9d4de;font-size:13px}.seg .on{background:#12263a;color:#fff}
.bar{height:8px;background:#d5dee6;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#12805c}
.c{background:#fff;border-radius:14px;padding:12px;margin:10px 0;border-left:6px solid var(--k);box-shadow:0 1px 2px #0002}.c.v{opacity:.6}.c h3{margin:6px 0 2px;font-size:19px}.c small{font-weight:400;color:#667}.c p{margin:2px 0}.s{color:#566;font-size:13px}
.t{display:flex;gap:8px;align-items:center}.t span{margin-left:auto;font-weight:700;font-size:13px}.n{background:#12805c;color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-style:normal}
.a{display:flex;gap:8px;margin-top:10px}.a button{flex:1}.a .p,.a .g{flex:2}
.k{background:#fff;border-radius:14px;padding:12px;margin:10px 0}.k h4{margin:0 0 6px}.big{font-size:40px;font-weight:800;line-height:1}
.f{border-left:6px solid #1f5eff}.f h3{margin:0}.f .nn{font-size:26px;font-weight:800}.f li{margin:3px 0;font-size:13px}.f ul{padding-left:18px;margin:6px 0}
details{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0}summary{font-weight:700;cursor:pointer;min-height:28px}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #c9d4de;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{background:none;border-radius:0;min-height:58px;font-size:12px;color:#667}nav .on{color:#1f5eff}
.sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:40}.sh.o{display:flex}
.sh>div{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:38px;background:#fff;border:1px solid #c9d4de;font-size:13px}.chips .on{background:#1f5eff;color:#fff;border-color:#1f5eff}
#toast{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));background:#12263a;color:#fff;border-radius:12px;padding:8px 12px;display:none;align-items:center;gap:8px;z-index:50}#toast.o{display:flex}#toast span{flex:1}#toast button{min-height:36px;background:#244560;color:#fff}
pre{background:#12263a;color:#cfe;padding:10px;border-radius:10px;overflow:auto;font-size:12px}.e{text-align:center;color:#789;padding:30px 0}
#lg{position:fixed;inset:0;background:#12263a;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}#lg div{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:360px}#lg input{margin:6px 0}#lg p{color:#a11;min-height:20px;margin:6px 0}
</style></head><body>
<div id="lg"><div><h2 style="margin:0 0 10px">Acceso</h2><input id="lu" placeholder="Usuario (ej. USFX01)" autocapitalize="characters" autocomplete="off"><input id="lp" type="password" placeholder="Contraseña" autocomplete="off"><p id="lm"></p><button class="p" style="width:100%" id="lb" onclick="entrar()">Entrar</button></div></div>
<header><div class="r"><b>Plan de ataque</b><span id="st"></span><button id="bCar" onclick="openS('sCar')"></button></div><div id="dias"></div></header>
<main>
<section id="v-plan" class="on"></section>
<section id="v-ruta"><div id="rTop"></div><input id="q" type="search" placeholder="Buscar aula, materia, docente…"><div id="lista"></div></section>
<section id="v-ajustes"></section>
</main>
<nav><button data-t="plan" class="on">🎯<br>Plan</button><button data-t="ruta">📍<br>Ruta</button><button data-t="ajustes">⚙️<br>Ajustes</button></nav>
<div id="toast"></div>
<div class="sh" id="sCar"><div><h3>Facultades</h3><div class="seg"><button onclick="car('all')">Todas</button><button onclick="car('none')">Ninguna</button></div><div class="chips" id="carL"></div><button class="p" style="width:100%;margin-top:14px" onclick="closeS()">Listo</button></div></div>
<div class="sh" id="sCnt"><div><h3 id="cT"></h3><p id="cB" class="s"></p><div style="display:flex;gap:8px"><button onclick="cstep(-1)">−</button><input id="cN" type="number" inputmode="numeric" min="0" style="text-align:center;font-size:22px"><button onclick="cstep(1)">＋</button></div><div class="a"><button onclick="closeS()">Cancelar</button><button class="p" onclick="csave()">Guardar</button></div></div></div>

<script>
const H={"USFX01": "844916498434ffb309692964c917d28af3a93a4f285f66a2c4448b79efeb1359", "USFX02": "7c1e660e6ee1784cbbe1c51ffe2b3f4d15106652a6b6ff62acf3f89684410960", "USFX03": "0d70eb379b8837ac19d0e6f4cc685152234ef7746089ef600d791f79ade94cfe", "USFX04": "14c421558e0929547aefb1140ebfde0630bcd7ebcf7fb94211bca83d96792e3f", "USFX05": "f58a2de11b78eebb4d01f04a00041053893fe035478d07276559e6c4671cf267", "USFX06": "cd66b0f37c3f3111d0035eabac5bcd5031eca720e7d650d9eddbe0f8144471da", "USFX07": "150855551f8f8b38917e109062c408968cc3371df70506d61083ce94b0d21dd8", "USFX08": "c7f8744865f760a81f3c4c54214f5d3d67e650d4e9f9a621a4d9102a719f98fa", "USFX09": "7e693663e3e8488524d8163ed6d9ff78b3d72520801e70de169607fdd02f8d87", "USFX10": "74cb1b74cf459a55d5e76272bae6ffec286de13390a763ee61ca71b0ac7b4904"};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DIAS=['LUN','MAR','MIE','JUE','VIE','SAB'],hoy=()=>['DOM',...DIAS][new Date().getDay()],nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const turnoDe=h=>h<12?'MAÑANA':h<18?'TARDE':'NOCHE',mins=h=>{const[a,b]=String(h||'0:0').split(':');return(a*60+ +b)||0},dur=(e,s)=>{const x=(mins(s)-mins(e))/60;return x>0?x:2};
const gk=d=>`${d.facultad}|${d.carrera}|${d.curso}|${d.materia}|${d.grupo}`;
let dev=LS.g('rc_dev',null);if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random());LS.s('rc_dev',dev)}
let base=LS.g('rc_base',[]),vis=LS.g('rc_vis',{}),cnt=LS.g('rc_cnt',{}),cfg={car:null,ord:'hora',term:1,cub:1,meta:20000,u:0,...LS.g('rc_cfg',{})};
let dia=hoy()==='DOM'?'LUN':hoy(),tur=turnoDe(new Date().getHours()),vista='pend',tab='plan',lim=60,data=[],fac=[],cubiertos=new Set(),F=null,ops=[],pend=false,cid,meta=null,rq,tt,ct,ses=LS.g('rc_ses',null),started=false;
const sel=d=>!cfg.car||cfg.car.includes(d.facultad),rows=()=>data.filter(sel),keep=()=>{LS.s('rc_vis',vis);LS.s('rc_cnt',cnt)};

/* ---------- Acceso: cada usuario se liga a UN solo dispositivo ---------- */
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const lock=m=>{$('#lg').style.display='flex';$('#lm').textContent=m||'';$('#lb').disabled=false};
async function entrar(){
 const u=$('#lu').value.trim().toUpperCase(),p=$('#lp').value.trim(),m=$('#lm');m.textContent='';
 if(!F)return m.textContent='Conectando… intenta en unos segundos';
 if(!H[u]||H[u]!==await sha(u+':'+p))return m.textContent='Usuario o contraseña incorrectos';
 $('#lb').disabled=true;
 try{const r=F.doc(F.db,'accesos',u),s=await F.getDoc(r);
  if(s.exists()){if(s.data().dev!==dev)return lock('Este usuario ya está activo en otro dispositivo.')}
  else await F.setDoc(r,{dev,at:new Date().toISOString()});
  ses=u;LS.s('rc_ses',u);$('#lg').style.display='none';arrancar();
 }catch(e){lock('No se pudo verificar el acceso (¿reglas o internet?).')}
}
async function verificar(){
 try{const s=await F.getDoc(F.doc(F.db,'accesos',ses));
  if(s.exists()&&s.data().dev===dev){$('#lg').style.display='none';arrancar()}
  else{ses=null;LS.s('rc_ses',null);lock(s.exists()?'Este usuario está activo en otro dispositivo.':'Acceso reiniciado. Vuelve a entrar.')}
 }catch(e){if(navigator.onLine===false){$('#lg').style.display='none';arrancar()}else lock('No se pudo verificar el acceso.')}
}
if(ses)$('#lg').style.display='none';

/* ---------- Firestore ---------- */
const W=f=>F?f():ops.push(f),fail=e=>toast('No se pudo guardar: '+(e.code||e)+' (revisa reglas en Ajustes)');
const setD=(c,id,o)=>W(()=>F.setDoc(F.doc(F.db,c,id),o,{merge:true}).catch(fail)),delD=(c,id)=>W(()=>F.deleteDoc(F.doc(F.db,c,id)).catch(fail));
window.fbReady=f=>{F=f;ops.splice(0).forEach(o=>o());if(ses)verificar()};
function arrancar(){
 if(started)return;started=true;
 F.onSnapshot(F.collection(F.db,'visitas_aulas'),{includeMetadataChanges:true},s=>{
  const v={},c={};s.forEach(x=>{const d=x.data();if(d.visitado)v[d.id]=1;if(d.conteoReal!==undefined)c[d.id]=+d.conteoReal||0});
  pend=s.metadata.hasPendingWrites;status();
  if(JSON.stringify([v,c])!==JSON.stringify([vis,cnt])){vis=v;cnt=c;keep();derive()}
 },()=>{$('#st').textContent='Sin permiso en Firestore';$('#st').className='w'});
 F.onSnapshot(F.collection(F.db,'recorridos_datos'),s=>{
  if(s.empty&&s.metadata.fromCache)return;let m=null;const ch=[];s.forEach(x=>{if(x.id==='meta')m=x.data();else ch.push(x.data())});
  if(!m)return;meta=m;const mine=ch.filter(c=>c.batch===m.batch).sort((a,b)=>a.i-b.i);
  if(mine.length!==m.chunks)return;base=mine.flatMap(c=>c.rows);LS.s('rc_base',base);derive();
 },()=>{});
 F.onSnapshot(F.doc(F.db,'config_app','global'),s=>{if(s.metadata.hasPendingWrites||!s.exists())return;const d=s.data();if((d.u||0)>cfg.u){cfg={...cfg,...d};LS.s('rc_cfg',cfg);render()}},()=>{});
}
function saveCfg(){cfg.u=Date.now();LS.s('rc_cfg',cfg);clearTimeout(ct);ct=setTimeout(()=>setD('config_app','global',cfg),700);render()}
async function subir(rows,name){
 const n=Math.ceil(rows.length/250),b=Date.now(),old=meta?.chunks||0;
 for(let i=0;i<n;i++)await F.setDoc(F.doc(F.db,'recorridos_datos','chunk_'+i),{i,batch:b,rows:rows.slice(i*250,i*250+250)});
 await F.setDoc(F.doc(F.db,'recorridos_datos','meta'),{chunks:n,batch:b,count:rows.length,name,at:new Date().toISOString()});
 for(let i=n;i<old;i++)F.deleteDoc(F.doc(F.db,'recorridos_datos','chunk_'+i));
}

/* ---------- Datos (Excel con una hoja por facultad) ---------- */
function derive(){data=base;fac=[...new Set(data.map(d=>d.facultad).filter(Boolean))].sort();cubiertos=new Set(data.filter(d=>vis[d.id]).map(gk));render()}
const loadX=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});
function parse(buf){
 const wb=XLSX.read(buf,{type:'array'}),out=[];
 wb.SheetNames.forEach((sn,si)=>XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}).forEach((r,i)=>{
  const g=(...ks)=>{for(const k of ks){const f=Object.keys(r).find(x=>x.trim().toLowerCase()===k.toLowerCase());if(f!==undefined)return String(r[f]).trim()}return ''};
  const dr=g('Dia','Día').toUpperCase().replace('É','E').replace('Á','A'),e=g('Hora Entrada','HoraEntrada'),s=g('Hora Salida','HoraSalida'),n=parseInt(g('Nro de programados','Programados'))||0;
  if(!g('Materia')&&!n)return;
  out.push({id:`s${si}_${i}`,facultad:g('Facultad')||sn.trim(),dia:DIAS.find(x=>dr.includes(x))||'LUN',horaEntrada:e,horaSalida:s,duracionHoras:dur(e,s),turno:turnoDe(+e.split(':')[0]||7),aula:g('Aula'),edificio:g('Edificio'),materia:g('Materia'),grupo:g('Grupo')||'A',curso:g('Curso')||'1',docente:g('Docente')||'Sin Docente',carrera:g('Carrera'),programados:n});
 }));
 return out;
}
async function excel(f){
 if(!f)return;toast('Leyendo Excel…');
 try{await loadX();const r=parse(await f.arrayBuffer());if(!r.length)return toast('No encontré filas. Revisa los encabezados.');
  base=r;LS.s('rc_base',r);derive();toast(r.length+' clases de '+new Set(r.map(x=>x.facultad)).size+' facultades. Subiendo…');
  W(()=>subir(r,f.name).then(()=>toast('Guardado en la nube ✔')).catch(fail));
 }catch(e){toast('No se pudo leer el Excel')}
}

/* ---------- Acciones ---------- */
function mark(id){
 const d=data.find(x=>x.id===id);if(!d)return;vis[id]=1;keep();
 setD('visitas_aulas',id,{id,visitado:true,grupoClave:gk(d),facultad:d.facultad,carrera:d.carrera,aula:d.aula,materia:d.materia,grupo:d.grupo,conteoReal:cnt[id]??d.programados,por:ses,fecha:new Date().toISOString()});
 derive();toast('Aula '+(d.aula||'S/A')+' visitada',[['Deshacer',()=>unmark(id)],['Contar',()=>cntSheet(id)]]);
}
function unmark(id){delete vis[id];delete cnt[id];keep();delD('visitas_aulas',id);derive()}
function cntSheet(id){const d=data.find(x=>x.id===id);cid=id;$('#cT').textContent='Aula '+(d.aula||'S/A')+' · '+d.materia;$('#cB').textContent='Programados: '+d.programados;$('#cN').value=cnt[id]??d.programados;openS('sCnt')}
const cstep=n=>{$('#cN').value=Math.max(0,(+$('#cN').value||0)+n)};
function csave(){const n=Math.max(0,+$('#cN').value||0);cnt[cid]=n;vis[cid]=1;keep();setD('visitas_aulas',cid,{id:cid,visitado:true,conteoReal:n});closeS();derive()}
function car(m){cfg.car=m==='all'?null:[];saveCfg();carSheet()}
function carSheet(){$('#carL').innerHTML=fac.map(c=>`<button class="${!cfg.car||cfg.car.includes(c)?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')||'<span class="s">Carga el Excel primero.</span>'}
function soloFac(f){cfg.car=[f];saveCfg();go('ruta')}
async function borrarVisitas(){
 if(prompt('Borra TODAS las visitas. Escribe BORRAR para confirmar')!=='BORRAR')return;
 const ids=Object.keys(vis);vis={};cnt={};keep();derive();
 W(async()=>{for(let i=0;i<ids.length;i+=400){const b=F.writeBatch(F.db);ids.slice(i,i+400).forEach(id=>b.delete(F.doc(F.db,'visitas_aulas',id)));await b.commit()}toast('Visitas borradas')});
}

/* ---------- Plan de ataque ---------- */
function plan(){
 const G=+cfg.meta||20000,g=new Map();
 data.forEach(d=>{const k=gk(d);let x=g.get(k);if(!x)g.set(k,x={n:0,v:0,r:0,f:d.facultad,s:[]});x.n=Math.max(x.n,d.programados);x.s.push(d);if(vis[d.id]){x.v=1;x.r=Math.max(x.r,cnt[d.id]??d.programados)}});
 let C=0,tot=0;g.forEach(x=>{tot+=x.n;if(x.v)C+=x.r});
 const falta=Math.max(0,G-C),pick=[];let acc=0;
 [...g.values()].filter(x=>!x.v).sort((a,b)=>b.n-a.n).forEach(x=>{if(acc<falta){acc+=x.n;pick.push(x)}});
 const F2={};
 g.forEach(x=>{(F2[x.f]??={f:x.f,tot:0,pl:0,au:0,dias:{},top:[]}).tot+=x.n});
 pick.forEach(x=>{const o=F2[x.f],r=[...x.s].sort((a,b)=>DIAS.indexOf(a.dia)-DIAS.indexOf(b.dia)||mins(a.horaEntrada)-mins(b.horaEntrada))[0];o.pl+=x.n;o.au++;o.dias[r.dia]=(o.dias[r.dia]||0)+x.n;o.top.push({n:x.n,r})});
 return{G,C,tot,falta,acc,list:Object.values(F2).filter(o=>o.pl).sort((a,b)=>b.pl-a.pl)};
}
function planV(){
 const P=plan(),p=Math.min(100,Math.round(P.C/P.G*100));
 $('#v-plan').innerHTML=`<div class="k"><label class="s">Meta de estudiantes</label><input type="number" inputmode="numeric" id="meta" value="${P.G}"><div class="big" style="margin-top:10px">${P.C.toLocaleString()}</div><p class="s" style="margin:2px 0 8px">alcanzados de ${P.G.toLocaleString()} (${p}%)</p><div class="bar"><i style="width:${p}%"></i></div>
 <p>${P.falta?`Faltan <b>${P.falta.toLocaleString()}</b>. Con los grupos más grandes sin visitar llegas a ~${(P.C+P.acc).toLocaleString()} visitando ${P.list.reduce((s,o)=>s+o.au,0)} aulas en ${P.list.length} facultades.`:'¡Meta cumplida!'}</p><p class="s">Cada grupo se cuenta una sola vez. Un alumno inscrito en varias materias puede repetirse, así que es un máximo estimado.</p></div>`
 +(P.list.map((o,i)=>{const ds=Object.entries(o.dias).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([d,n])=>`${d} (${n})`).join(', ');
  return `<div class="k f"><h3>${i+1}. ${esc(o.f)}</h3><div class="nn">${o.pl.toLocaleString()} <small class="s">estudiantes en ${o.au} aulas</small></div><p class="s">Cubre ${Math.round(o.pl/o.tot*100)}% de la facultad · Mejores días: ${ds}</p><ul>${o.top.sort((a,b)=>b.n-a.n).slice(0,4).map(t=>`<li><b>${t.n}</b> · ${t.r.dia} ${esc(t.r.horaEntrada)} · Aula ${esc(t.r.aula||'S/A')} · ${esc(t.r.materia)}</li>`).join('')}</ul><button class="p" style="width:100%" onclick="soloFac('${esc(o.f).replace(/'/g,'&#39;')}')">Ver ruta de esta facultad</button></div>`}).join('')||`<div class="e">${data.length?'Sin pendientes':'Carga el Excel en Ajustes.'}</div>`);
 $('#meta').onchange=e=>{cfg.meta=+e.target.value||20000;saveCfg()};
}

/* ---------- Ruta ---------- */
const cls=n=>n>=80?['Masiva','#c62828']:n>=50?['Grande','#e65100']:n>=20?['Mediana','#1f5eff']:['Pequeña','#12805c'];
const ahora=d=>d.dia===hoy()&&mins(d.horaEntrada)<=nowM()&&mins(d.horaSalida)>nowM();
function card(d){
 const v=vis[d.id],[cn,cc]=cls(d.programados);
 return `<article class="c${v?' v':''}" style="--k:${cc}" data-id="${esc(d.id)}"><div class="t"><b>${esc(d.horaEntrada)}–${esc(d.horaSalida)}</b>${ahora(d)?'<i class="n">AHORA</i>':''}<span style="color:${cc}">${cn} · ${d.programados}</span></div>
 <h3>Aula ${esc(d.aula||'S/A')} <small>${esc(d.edificio)}</small></h3><p>${esc(d.materia)} · Gr. ${esc(d.grupo)}</p><p class="s">${esc(d.facultad)} · ${esc(d.carrera)} · Sem ${esc(d.curso)}</p>
 <div class="a">${v?`<button class="g" data-a="cnt">✔ ${cnt[d.id]??d.programados} alumnos ✎</button><button data-a="del">Quitar</button>`:`<button class="p" data-a="ok">Marcar visitada</button>`}</div></article>`;
}
function ruta(){
 const all=rows().filter(d=>d.dia===dia&&(tur==='TODOS'||d.turno===tur)),nv=all.filter(d=>vis[d.id]).length;
 const seg=(a,k,cur)=>`<div class="seg">${a.map(([v,l])=>`<button data-${k}="${v}" class="${v===cur?'on':''}">${l}</button>`).join('')}</div>`;
 $('#rTop').innerHTML=`<div class="k"><b>${nv} de ${all.length} clases visitadas</b><div class="bar" style="margin-top:6px"><i style="width:${all.length?nv/all.length*100:0}%"></i></div></div>`
 +seg([['MAÑANA','Mañana'],['TARDE','Tarde'],['NOCHE','Noche'],['TODOS','Todos']],'u',tur)+seg([['pend','Pendientes'],['vis','Visitadas'],['all','Todas']],'v',vista)
 +`<div class="seg"><button data-o="1">Orden: ${cfg.ord==='hora'?'por hora':'por tamaño'}</button><button data-f="term" class="${cfg.term?'on':''}">Ocultar terminadas</button><button data-f="cub" class="${cfg.cub?'on':''}">Ocultar cubiertas</button></div>`;
 lista(all);
}
function lista(all){
 all=all||rows().filter(d=>d.dia===dia&&(tur==='TODOS'||d.turno===tur));
 const q=$('#q').value.toLowerCase();let l=all,h=0;
 if(q)l=l.filter(d=>[d.aula,d.materia,d.docente,d.edificio,d.curso,d.grupo,d.carrera].join(' ').toLowerCase().includes(q));
 if(vista==='pend')l=l.filter(d=>{if(vis[d.id])return false;if((cfg.cub&&cubiertos.has(gk(d)))||(cfg.term&&dia===hoy()&&mins(d.horaSalida)<=nowM())){h++;return false}return true});
 else if(vista==='vis')l=l.filter(d=>vis[d.id]);
 l.sort((a,b)=>cfg.ord==='hora'?(ahora(b)-ahora(a))||mins(a.horaEntrada)-mins(b.horaEntrada)||b.programados-a.programados:b.programados-a.programados||mins(a.horaEntrada)-mins(b.horaEntrada));
 $('#lista').innerHTML=(l.slice(0,lim).map(card).join('')||`<div class="e">${data.length?(vista==='pend'?'Nada pendiente aquí ✔':'Sin resultados'):'Carga el Excel en Ajustes.'}</div>`)
 +(l.length>lim?`<button style="width:100%" data-more="1">Mostrar más (${l.length-lim})</button>`:'')+(h?`<p class="s" style="text-align:center">${h} ocultas (ya cubiertas o terminadas)</p>`:'');
}
const RULES=`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /accesos/{id} {\n      allow read, create: if true;\n      allow update, delete: if false;\n    }\n    match /{col}/{doc} {\n      allow read, write: if col in ['visitas_aulas','recorridos_datos','config_app'];\n    }\n  }\n}`;
function ajustes(){
 $('#v-ajustes').innerHTML=`<div class="k"><h4>Horarios (readme.xlsx)</h4><p class="s">${data.length} clases · ${fac.length} facultades${meta?' · '+esc(meta.name):''}</p><input type="file" id="xl" accept=".xlsx,.xls"><p class="s">Una hoja por facultad. Se guarda en la nube y se comparte con todos los dispositivos.</p></div>
 <div class="k"><h4>Facultades</h4><button style="width:100%" onclick="openS('sCar')">Elegir (${cfg.car?cfg.car.length:fac.length}/${fac.length})</button></div>
 <details><summary>Reglas de Firestore</summary><p class="s">Firebase → Firestore → Reglas: Ctrl+A, borra, pega y publica.</p><pre>${esc(RULES)}</pre><button onclick="navigator.clipboard.writeText(RULES).then(()=>toast('Copiado'))">Copiar reglas</button></details>
 <details><summary>Zona de riesgo</summary><button class="x" onclick="borrarVisitas()">Borrar todas las visitas</button></details><p class="s">Sesión: ${esc(ses)}</p>`;
 $('#xl').onchange=e=>excel(e.target.files[0]);
}
function status(){const e=$('#st');e.className=navigator.onLine?'':'w';e.textContent=!navigator.onLine?'Sin internet':pend?'Guardando…':F?'Sincronizado':'Conectando…'}
function draw(){
 $('#dias').className=tab==='ruta'?'on':'';$('#dias').innerHTML=DIAS.map(d=>`<button data-d="${d}" class="${d===dia?'on':''}">${{MIE:'MIÉ',SAB:'SÁB'}[d]||d}${d===hoy()?'<u></u>':''}</button>`).join('');
 $('#bCar').textContent=`Facultades ${cfg.car?cfg.car.length:fac.length}/${fac.length}`;status();
 ({plan:planV,ruta,ajustes})[tab]();
}
function render(){cancelAnimationFrame(rq);rq=requestAnimationFrame(draw)}
function go(t){tab=t;document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='v-'+t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));scrollTo(0,0);render()}
const openS=id=>{if(id==='sCar')carSheet();$('#'+id).classList.add('o')},closeS=()=>document.querySelectorAll('.sh').forEach(s=>s.classList.remove('o'));
function toast(m,acts){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`;(acts||[]).forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{t.classList.remove('o');f()};t.append(b)});t.classList.add('o');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('o'),acts?6000:3000)}

document.addEventListener('click',e=>{
 const b=e.target.closest('button'),s=e.target.closest('.sh');
 if(s&&e.target===s)return closeS();if(!b)return;const D=b.dataset;
 if(D.t)return go(D.t);if(D.d){dia=D.d;lim=60;return render()}
 if(D.c){const cur=new Set(cfg.car||fac);cur.has(D.c)?cur.delete(D.c):cur.add(D.c);cfg.car=cur.size===fac.length?null:[...cur];saveCfg();return carSheet()}
 if(D.u){tur=D.u;lim=60;return render()}if(D.v){vista=D.v;lim=60;return render()}
 if(D.more){lim+=60;return lista()}if(D.o){cfg.ord=cfg.ord==='hora'?'tam':'hora';return saveCfg()}if(D.f){cfg[D.f]=cfg[D.f]?0:1;return saveCfg()}
 const c=b.closest('article');if(c&&D.a)({ok:mark,del:unmark,cnt:cntSheet})[D.a](c.dataset.id);
});
$('#q').addEventListener('input',()=>{lim=60;lista()});
addEventListener('online',status);addEventListener('offline',status);
setInterval(()=>{if(tab==='ruta'&&!document.querySelector('.sh.o')&&document.activeElement.tagName!=='INPUT')render()},60000);
derive();
